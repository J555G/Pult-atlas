<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Every part of Pult, how the parts connect, what they cost the device, and how they grew version by version.">
<meta name="theme-color" content="#1a2027">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root { height: 100%; }   /* the bars carry the safe areas themselves, so the page fills the screen */
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
</style>
<title>Pult Component Atlas</title>
<style>
/* Layout: the drawing fills the screen between a slim bar of controls and a slim version bar; a part's panel slides in over it. */
:root {   /* Pult's own colours (lesepult/style.css), light; dark below */
  --bg: #faf8f3; --surface: #ffffff; --ink: #211f1b; --mut: #6f6a60; --line: #ddd6c6; --soft: #efe9da;
  --acc: #7a2e2e;          /* Pult's burgundy: the selection */
  --up: #2e5a7a;           /* Pult's blue: what the selected part uses */
  --down: #a8641c;         /* ochre: what uses the selected part */
  --flow: #6f5a8a;         /* data flows */
  --add: #3f7a4a;          /* new in a later version */
  --h0: #e6e0d2; --h1: #cfdcc4; --h2: #ecdca0; --h3: #e8bf7d; --h4: #d98c5a; --h5: #b8473a;
  --display: "Gentium Book Plus", Georgia, serif; --ui: "Source Sans 3", -apple-system, system-ui, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
:root[data-theme="dark"] {
  --bg: #1b1a18; --surface: #232220; --ink: #e9e5db; --mut: #a29c90; --line: #3a3833; --soft: #2a2926;
  --acc: #e3a586; --up: #8fbbe0; --down: #d9a05b; --flow: #b49ac8; --add: #8fcf8f;
  --h0: #34322d; --h1: #3d5240; --h2: #6b5f30; --h3: #7d5a2c; --h4: #8a4a30; --h5: #8f3a32; color-scheme: dark }
html, body { height: 100%; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* no double-tap zoom, no automatic text enlarging */
body { height: 100dvh; }   /* Safari: exactly the visible screen, not the area behind its toolbars */
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--ui); display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding-top: max(3px, env(safe-area-inset-top, 0px)); padding-bottom: 3px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
h1 { font: 700 17px/1.1 var(--display); flex: none; margin: 0; letter-spacing: .01em; white-space: nowrap; }
h1 small { font: 400 12px var(--ui); color: var(--mut); margin-left: 6px; }
.grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lab { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); }
.seg { flex: none; display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 2px 7px; font: 600 12.5px var(--ui); cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
button.plain[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
button.plain { flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 7px; padding: 2px 8px; font: 600 12.5px var(--ui); cursor: pointer; white-space: nowrap; }
.rng { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mut); }
.rng input { width: 110px; accent-color: var(--acc); }
.menu { position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 10px 28px rgba(0,0,0,.2); padding: 10px 12px; display: grid; gap: 8px; }
.menu .row { display: flex; gap: 8px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; user-select: none; }
.search { position: relative; flex: 1 1 150px; min-width: 90px; max-width: 280px; }
header .seg.nb { display: inline-flex !important; }
.seg.nb button { font-size: 17px; padding: 1px 10px; }
.seg.nb button:disabled { color: var(--line); cursor: default; }
@media (max-width: 1440px) { h1 { display: none; } .rng input { width: 80px; } .rng span, #optBtn .t { display: none; } .search { flex-basis: 130px; max-width: 160px; } }
.seg .s, button .s { display: none; }
@media (max-width: 560px) { .rng span { display: none; } .rng input { width: 48px; } #optBtn .t { display: none; } header { gap: 4px 5px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .seg .l, button .l { display: none; } .seg .s, button .s { display: inline; } .seg button { padding: 2px 6px; } .search { flex: 1 1 60px; min-width: 56px; }
  .seg.nb button { padding: 1px 6px; } button.plain { padding: 2px 7px; } .rng input { width: 44px; } }

.search input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; background: var(--bg); color: var(--ink); font: 14px var(--ui); }
.results { position: fixed; width: 300px; z-index: 20; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: 50vh; overflow: auto; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 7px 10px; cursor: pointer; font: 14px var(--ui); }
.results button:hover, .results button.on { background: var(--soft); }
.results small { color: var(--mut); display: block; font-size: 12px; }
main { flex: 1; display: flex; min-height: 0; position: relative; overflow: hidden; }
/* the Data view: the Data Map – one row per stream of data, source → toolkit → package → in Pult; stacked on a phone */
#start { position: absolute; inset: 0; overflow: auto; background: var(--bg); z-index: 3; padding: 28px max(16px, env(safe-area-inset-left, 0px)) 40px; }
#start .st-in { max-width: 860px; margin: 0 auto; }
#start h2 { font: 700 30px/1.1 var(--display); margin: 0 0 8px; }
#start .lede { font-size: 16px; color: var(--mut); max-width: 62ch; margin: 0 0 22px; }
#start .go { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 0 0 26px; }
#start .go button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; color: var(--ink); font: 14px/1.35 var(--ui); min-height: 44px; }
#start .go button b { display: block; font: 700 17px/1.2 var(--display); color: var(--acc); margin-bottom: 3px; }
#start .go button:hover { border-color: var(--acc); }
#start h3 { font: 600 12px var(--ui); text-transform: uppercase; letter-spacing: .08em; color: var(--mut); margin: 0 0 8px; }
#start .floors { display: grid; gap: 8px; }
#start .fl { display: grid; grid-template-columns: 11rem 1fr; gap: 10px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 9px 12px; }
#start .fl b { font: 700 16px/1.2 var(--display); }
#start .fl .ps { display: flex; flex-wrap: wrap; gap: 4px; }
#start .fl .ps button { font: 13px var(--ui); border: 1px solid var(--line); border-radius: 14px; padding: 3px 10px; min-height: 28px; background: var(--bg); color: var(--ink); cursor: pointer; }
@media (max-width: 600px) { #start .fl { grid-template-columns: 1fr; } }
#dmap { position: absolute; inset: 0; overflow: auto; background: var(--bg); padding: 18px max(16px, env(safe-area-inset-left, 0px)) 40px; -webkit-overflow-scrolling: touch; }
#dmap .dm-in { max-width: 1280px; margin: 0 auto; }
#dmap h2 { font: 700 26px/1.15 var(--display); margin: 0 0 6px; }
#dmap h3 { font: 700 19px/1.2 var(--display); margin: 30px 0 10px; }
#dmap .lede { color: var(--mut); max-width: 68ch; margin: 0 0 16px; font-size: 15px; }
#dmap .dm-heads, #dmap .dm-row { display: grid; grid-template-columns: 9rem repeat(4, minmax(0, 1fr)); gap: 0 24px; }
#dmap .dm-heads { position: sticky; top: -18px; background: var(--bg); z-index: 2; padding: 8px 0; border-bottom: 1px solid var(--line); }
#dmap .dm-heads div { font: 600 12px/1.2 var(--ui); text-transform: uppercase; letter-spacing: .08em; color: var(--mut); }
#dmap .dm-row { padding: 14px 0; border-bottom: 1px solid var(--line); border-radius: 8px; }
#dmap .dm-row.hit { background: color-mix(in srgb, var(--acc) 7%, transparent); box-shadow: inset 3px 0 0 var(--acc); padding-left: 0; }
#dmap .dm-stream { font: 700 17px/1.2 var(--display); padding: 6px 0 0 8px; }
#dmap .dm-stream small { display: block; font: 400 13px/1.35 var(--ui); color: var(--mut); margin-top: 4px; }
#dmap .dm-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 9px 11px; font-size: 14px; line-height: 1.4; min-width: 0; }
#dmap .dm-card b { display: block; font-weight: 700; margin-bottom: 2px; }
#dmap .dm-card ul { margin: 2px 0 0; padding-left: 1.05em; } #dmap .dm-card li { margin: 1px 0; }
#dmap .dm-card .note { margin-top: 6px; font-size: 13px; color: var(--mut); }
#dmap .dm-card.priv b, #dmap .priv { color: var(--down); }
#dmap .dm-row > .dm-card:not(:last-child)::after { content: ""; position: absolute; right: -19px; top: 50%; width: 12px; height: 2px; background: var(--mut); opacity: .6; }
#dmap .dm-row > .dm-card:not(:last-child)::before { content: ""; position: absolute; right: -22px; top: calc(50% - 4px); border: 5px solid transparent; border-left: 6px solid var(--mut); border-right: 0; opacity: .6; }
#dmap .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
#dmap .chips button { font: 13px var(--ui); border: 1px solid var(--line); border-radius: 14px; padding: 3px 10px; min-height: 28px; background: var(--bg); color: var(--ink); cursor: pointer; }
#dmap .chips button.on { border-color: var(--acc); color: var(--acc); font-weight: 600; }
#dmap .dm-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 14px; font-size: 13px; color: var(--mut); }
#dmap .dm-legend i { display: inline-block; width: 4px; height: 14px; border-radius: 2px; background: var(--c); vertical-align: -2px; margin-right: 6px; }
#dmap .dm-layers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
#dmap .dm-layer { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; }
#dmap .dm-layer b { display: block; font: 700 16px/1.2 var(--display); margin-bottom: 3px; } #dmap .dm-layer p { margin: 0; color: var(--mut); font-size: 14px; }
@media (max-width: 860px) {
  #dmap .dm-heads { display: none; } #dmap .dm-row { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  #dmap .dm-row > .dm-card::before, #dmap .dm-row > .dm-card::after { display: none; }
  #dmap .dm-row > .dm-card:not(:last-child)::after { display: block; content: "↓"; background: none; width: auto; height: auto; right: auto; left: 50%; top: auto; bottom: -18px; color: var(--mut); font-size: 15px; line-height: 1; transform: translateX(-50%); }
  #dmap .dm-card .step { display: block; font: 600 11px/1 var(--ui); text-transform: uppercase; letter-spacing: .08em; color: var(--mut); margin-bottom: 4px; }
  #dmap .dm-layers { grid-template-columns: minmax(0, 1fr); } }
#dmap .dm-card .step { display: none; }
@media (max-width: 860px) { #dmap .dm-card .step { display: block; } }
#stage { flex: 1; min-width: 0; min-height: 0; position: relative; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#cv3 { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }   /* (absolute: the drawing never holds its area open – the pane beside or below can take the room) */
#cv3:active { cursor: grabbing; }
#panel { flex: none; width: 380px; max-width: 46vw; border-left: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 16px 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }   /* a fixed pane beside the drawing */
#panel h2 { font: 700 22px/1.15 var(--display); margin: 0 0 4px; padding-right: 30px; text-wrap: balance; }
body:not(.open) #pclose { display: none; }
#pnav:has(#pback:disabled):has(#pfwd:disabled) #pback, #pnav:has(#pback:disabled):has(#pfwd:disabled) #pfwd { display: none; }
#pnav { position: sticky; top: 0; float: right; margin: -6px -6px 0 8px; z-index: 1; display: flex; gap: 4px; background: var(--surface); }
#pnav button { font-size: 17px; } #pnav button:disabled { color: var(--line); cursor: default; }
#pclose { background: var(--surface); }
#panel h3 { font: 600 11px var(--ui); text-transform: uppercase; letter-spacing: .07em; color: var(--mut); margin: 18px 0 6px; }
/* a part's page: its sections fold, as Pult's dictionary sources do */
#panel details.sec { border-top: 1px solid var(--line); }
#panel details.sec > summary { list-style: none; cursor: pointer; padding: 9px 0; font: 600 15px var(--ui); display: flex; align-items: baseline; gap: 8px; color: var(--ink); }
#panel details.sec > summary::-webkit-details-marker { display: none; }
#panel details.sec > summary::before { content: '▸'; color: var(--mut); font-size: 12px; transition: transform .15s; display: inline-block; }
#panel details.sec[open] > summary::before { transform: rotate(90deg); }
#panel details.sec > summary h3 { all: unset; }
#panel details.sec > :not(summary):last-child { margin-bottom: 12px; }
.touch #panel details.sec > summary { min-height: 44px; align-items: center; padding: 0; font-size: calc(15px * var(--k)); }
#panel p { margin: 6px 0; max-width: 65ch; }
.crumbs { font-size: 12px; color: var(--mut); }
.crumbs a { color: var(--mut); cursor: pointer; text-decoration: underline dotted; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.pill { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }
.res { display: grid; grid-template-columns: 74px 1fr; gap: 6px 10px; align-items: start; }
.res .bar { display: flex; gap: 3px; margin-top: 4px; }
.res .bar i { width: 16px; height: 8px; border-radius: 2px; background: var(--soft); }
.res .note { grid-column: 2; font-size: 12.5px; color: var(--mut); margin-top: -2px; }
.res b { font-weight: 600; font-size: 13px; }
.list { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.list li { padding: 3px 0; border-bottom: 1px solid var(--soft); display: flex; gap: 8px; justify-content: space-between; }
.list code, .mono { font: 12px var(--mono); }
.list a { color: var(--ink); cursor: pointer; }
.list .k { color: var(--mut); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dirup { color: var(--up); } .dirdown { color: var(--down); } .dirflow { color: var(--flow); }
.glist { list-style: none; padding: 0; margin: 8px 0; }
.glist li { border-top: 1px solid var(--line); }
.glist a { display: block; padding: 9px 2px; cursor: pointer; color: var(--ink); }
.glist b { display: block; font-size: 15px; } .glist span { color: var(--mut); font-size: 12.5px; }
.steps { display: flex; gap: 5px; flex-wrap: wrap; margin: 8px 0; }
.steps button { min-width: 28px; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 12.5px var(--ui); cursor: pointer; }
.steps button.done { background: var(--soft); }
.steps button[aria-current="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
.stepnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.ghl { border-left: 3px solid var(--acc); background: var(--soft); border-radius: 0 7px 7px 0; padding: 6px 10px; }
.ghl p { margin: 4px 0; }
.lab { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); }
.hintp { font-size: 12.5px; color: var(--mut); }
.hintp a, .list a.ic, a.ic { cursor: pointer; color: var(--acc); text-decoration: none; }
.sub { font-size: 12px; color: var(--mut); }
.tag { font: 600 10.5px var(--ui); border-radius: 4px; padding: 0 5px; margin-left: 5px; background: var(--soft); color: var(--mut); }
.sup { padding-left: 22px; margin: 6px 0; font-size: 13px; }
.sup li { padding: 4px 4px; border-radius: 6px; cursor: pointer; }
.sup li.on { background: var(--soft); outline: 2px solid var(--acc); }
.tree li { border-bottom: 0; padding-top: 1px; padding-bottom: 1px; }
.cmp { display: grid; gap: 6px; margin: 8px 0; } .cmp label { display: flex; gap: 8px; align-items: center; font-size: 12.5px; } .cmp input { flex: 1; accent-color: var(--acc); }
.add { color: var(--add); }
#tq { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; background: var(--bg); color: var(--ink); font: 14px var(--ui); margin: 6px 0; }
#tdir { margin: 4px 0; }
button.sm { font-size: 11.5px; padding: 0 7px; margin-left: 6px; text-transform: none; letter-spacing: 0; }
#inside { width: 100%; display: block; }
.backg { display: inline-block; margin-bottom: 6px; font-size: 12.5px; color: var(--acc); cursor: pointer; }
#mini { flex: 1 1 340px; min-width: 260px; max-width: 760px; height: 30px; border-radius: 6px; cursor: pointer; display: block; }   /* the overview strip in the top bar */
.legend { font-size: 12.5px; color: var(--mut); display: grid; gap: 4px; }
.legend span.sw { display: inline-block; width: 22px; height: 3px; vertical-align: middle; margin-right: 6px; }
.heat { display: flex; gap: 2px; align-items: center; }
.heat i { width: 18px; height: 10px; border-radius: 2px; }
body:not(.verbar) footer { display: none; }
footer { border-top: 1px solid var(--line); background: var(--surface); padding-top: 2px; padding-bottom: max(2px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: center; }
footer #play { padding: 1px 8px; }
.track { position: relative; flex: 1 1 45%; min-width: 120px; height: 22px; }
.track input { position: absolute; inset: 0; width: 100%; margin: 0; background: transparent; }
footer input[type=range] { accent-color: var(--acc); }
#verInfo { flex: 1 1 55%; min-width: 0; font-size: 12px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
#verInfo b { color: var(--ink); }
#spark { position: absolute; inset: 0; height: 22px; width: 100%; display: block; opacity: .7; }
.node rect.box { stroke: var(--line); stroke-width: 1; }
.node text { fill: var(--ink); font: 600 12.5px var(--ui); pointer-events: none; }
.node text.sub { font: 400 10.5px var(--mono); fill: var(--mut); }
.node { cursor: pointer; }
.node.sel rect.box { stroke: var(--acc); stroke-width: 2.5; }
.node.chg rect.box { stroke: var(--flow); stroke-width: 2; stroke-dasharray: 4 3; }
.node.fade, .edge.fade { opacity: .05; }
.node.off { opacity: .32; }
.group > rect { fill: none; stroke: var(--line); stroke-dasharray: 3 3; }
.group > text { fill: var(--mut); font: 600 11px var(--ui); letter-spacing: .05em; text-transform: uppercase; }
.tier text { fill: var(--mut); font: italic 400 15px var(--display); }
.tier line { stroke: var(--line); }
.edge { fill: none; stroke: var(--mut); stroke-opacity: .35; }
.edge.flow { stroke: var(--flow); stroke-dasharray: 5 3; stroke-opacity: .55; }
.edge.up { stroke: var(--up); stroke-opacity: .95; }
.edge.down { stroke: var(--down); stroke-opacity: .95; }
.elabel { font: 11px var(--ui); fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--mut); background: color-mix(in srgb, var(--bg) 85%, transparent); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; font-size: 12.5px; max-width: 280px; box-shadow: 0 6px 18px rgba(0,0,0,.15); z-index: 5; }
@media (orientation: portrait) {   /* portrait (phone or iPad held upright): the pane at the bottom */
  main { flex-direction: column; }
  #panel { width: auto; max-width: none; height: 44%; border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .touch #panel { width: auto; }
  h1 small { display: none; }
}
/* touch screens: finger-sized controls; --k is the Size setting (Normal 1 = 44 px, Large 1.25, Extra large 1.5) */
:root { --k: 1; }
.touch header { gap: calc(6px * var(--k)) calc(8px * var(--k)); padding-bottom: 5px; }

<script>
addEventListener('error', e => { const h = document.getElementById('hint'); if (h) { h.textContent = 'Error: ' + (e.message || e.error) + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')'; h.style.color = '#c2410c'; } });

let MODEL, HIST, N = new Map(), OWN = new Map(), V = null, CK = [];

// ---------------------------------------------------------------- data
async function load() {
  const [m, h] = await Promise.all([fetch('model.json').then(r => r.json()), fetch('history.json').then(r => r.json())]);
  MODEL = m; HIST = h.commits;
  for (const c of m.components) N.set(c.id, { ...c, children: [] });
  for (const c of N.values()) { const p = c.id.includes('.') ? c.id.slice(0, c.id.lastIndexOf('.')) : null; c.parent = p && N.has(p) ? p : null; c.level = c.id.split('.').length; c.l1 = c.id.split('.')[0]; if (c.parent) N.get(c.parent).children.push(c.id); }

  // the versions: every commit rebuilt from the changes, with a full copy every 20 for the slider
  let st = { files: {}, decls: {}, du: {} };
  HIST.forEach((c, i) => { for (const k of ['files', 'decls', 'du']) for (const [n, x] of Object.entries(c[k] || {})) { if (x === null) delete st[k][n]; else st[k][n] = x; }
    if (i % 20 === 0) CK[i] = copySt(st); c._bytes = Object.values(st.decls).reduce((a, b) => a + b, 0); });
  S.ver = HIST.length - 1;
}
const copySt = st => ({ files: { ...st.files }, decls: { ...st.decls }, du: { ...st.du } });   // (the lists inside are never changed, only replaced)
function stateAt(i) {
  const b = Math.floor(i / 20) * 20, st = copySt(CK[b]);
  for (let j = b + 1; j <= i; j++) for (const k of ['files', 'decls', 'du']) for (const [n, x] of Object.entries(HIST[j][k] || {})) { if (x === null) delete st[k][n]; else st[k][n] = x; }

}
const owner = k => OWN.get(k) || MODEL.fileDefault[k.split('|')[0]] || null;
function assetBytes(a, files) { let s = 0; for (const [k, v] of Object.entries(files)) if (k === a || k.startsWith(a.endsWith('/') ? a : a + '/') || (k.endsWith('/') && a.startsWith(k) && false)) s += v; return s; }

  const st = stateAt(i), ex = new Set(), code = new Map(), asset = new Map(), edges = new Map(), chg = new Set(), fdecl = new Map();
  for (const [k, s] of Object.entries(st.decls)) { const o = owner(k); if (!o) continue; ex.add(o); code.set(o, (code.get(o) || 0) + s); (fdecl.get(o) || fdecl.set(o, []).get(o)).push([k, s]); }
  for (const c of N.values()) for (const a of c.assets || []) { const b = assetBytes(a, st.files); if (b) { ex.add(c.id); asset.set(c.id, (asset.get(c.id) || 0) + b); } }
  for (const c of N.values()) if (c.l1 === 'tools' && !c.children.length) ex.add(c.id);
  for (const [k, us] of Object.entries(st.du)) { const a = owner(k); if (!a) continue; for (const u of us) { const b = owner(u); if (b && b !== a) edges.set(a + '>' + b, (edges.get(a + '>' + b) || 0) + 1); } }
  for (const k of Object.keys(HIST[i].decls || {})) { const o = owner(k); if (o) chg.add(o); }
  // a part with no code or files of its own exists when a partner of its flows does (online sources); parents when a child does
  for (const f of MODEL.flows) { if (ex.has(f.from) && !hasOwn(f.to)) ex.add(f.to); if (ex.has(f.to) && !hasOwn(f.from)) ex.add(f.from); }
  for (const id of [...ex]) { let p = N.get(id)?.parent; while (p) { ex.add(p); p = N.get(p).parent; } }
  for (const id of [...chg]) { let p = N.get(id)?.parent; while (p) { chg.add(p); p = N.get(p).parent; } }
  const tot = (id, m) => { const c = N.get(id); return (m.get(id) || 0) + c.children.reduce((a, x) => a + tot(x, m), 0); };
  return { st, ex, code, asset, edges, chg, fdecl, tot };

const hasOwn = id => { const c = N.get(id); return c && ((c.decls || []).length || (c.assets || []).length); };
function rating(id, m) {   // its own estimate, else the highest of its parts
  const c = N.get(id); if (c.res?.[m]) return c.res[m][0];

}
const fmtB = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : b >= 1e3 ? Math.round(b / 1e3) + ' KB' : b + ' B';
function netOf(id) { const c = N.get(id); if (c.net) return c.net; const s = new Set(c.children.filter(x => V.ex.has(x)).map(netOf)); return s.size === 1 ? [...s][0] : s.size ? 'both' : 'offline'; }

// ---------------------------------------------------------------- what is shown: open parts replaced by their parts
function visible() {
  const out = []; const walk = id => { const c = N.get(id); if (!V.ex.has(id)) return; const kids = c.children.filter(x => V.ex.has(x)); if (S.exp.has(id) && kids.length) kids.forEach(walk); else out.push(id); };
  MODEL.l1.forEach(l => walk(l.id)); return out;
}
function rep(id, vis) { let x = id; while (x && !vis.has(x)) x = N.get(x)?.parent; return x; }

  const E = new Map();
  for (const [k, n] of V.edges) { const [a, b] = k.split('>'), ra = rep(a, vis), rb = rep(b, vis); if (!ra || !rb || ra === rb) continue; const key = 'c|' + ra + '>' + rb; const e = E.get(key) || { a: ra, b: rb, kind: 'code', n: 0, labels: [] }; e.n += n; E.set(key, e); }
  for (const f of MODEL.flows) { if (!V.ex.has(f.from) || !V.ex.has(f.to)) continue; const ra = rep(f.from, vis), rb = rep(f.to, vis); if (!ra || !rb || ra === rb) continue; const key = 'f|' + ra + '>' + rb; const e = E.get(key) || { a: ra, b: rb, kind: 'flow', n: 0, labels: [] }; e.n++; if (e.labels.length < 3) e.labels.push(f.label); E.set(key, e); }

// what the selected part relies on (following uses and incoming flows) and what relies on it – near and further
function reach(sel, edges) {

  const walk = dir => { const d = new Map([[sel, 0]]), q = [sel]; while (q.length) { const x = q.shift(); for (const e of edges) { const [u, v] = dep(e), [f, t] = dir ? [u, v] : [v, u]; if (f === x && !d.has(t) && d.get(x) < S.depth) { d.set(t, d.get(x) + 1); q.push(t); } } } d.delete(sel); return d; };

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const HUE = id => { const l = MODEL.l1.find(l => l.id === N.get(id).l1); if (!l) return 210; const sib = MODEL.l1.filter(m => m.tier === l.tier), i = sib.indexOf(l), n = sib.length;
