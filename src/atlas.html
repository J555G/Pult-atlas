<title>Pult Component Atlas</title>

<style>
/* Layout: the drawing fills the screen between a slim bar of controls and a slim version bar; a part's panel slides in over it. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --ink: #1d232b; --mut: #5f6873; --line: #c9cec9; --soft: #e6e9e4;

  --down: #c2410c;         /* what uses the selected part */
  --flow: #7c5aa6;         /* data flows */
  --add: #2f8a57;          /* new in a later version */
  --h0: #d9ddd8; --h1: #b9dfd4; --h2: #f2e39a; --h3: #f7c06a; --h4: #ef8a4f; --h5: #d9483b;
  --display: "Gentium Book Plus", Georgia, serif; --ui: "Source Sans 3", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161b; --surface: #1a2027; --ink: #e5e8ea; --mut: #98a2ad; --line: #39424c; --soft: #232a32;
  --acc: #6aa9d8; --up: #6aa9ec; --down: #f08a4b; --flow: #b394e0; --add: #5fc08a;
  --h0: #39414a; --h1: #2f6b5f; --h2: #7d7034; --h3: #96662a; --h4: #a3502c; --h5: #a83a32; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161b; --surface: #1a2027; --ink: #e5e8ea; --mut: #98a2ad; --line: #39424c; --soft: #232a32;
  --acc: #6aa9d8; --up: #6aa9ec; --down: #f08a4b; --flow: #b394e0; --add: #5fc08a;
  --h0: #39414a; --h1: #2f6b5f; --h2: #7d7034; --h3: #96662a; --h4: #a3502c; --h5: #a83a32; color-scheme: dark }
html, body { height: 100%; }
body { height: 100dvh; }   /* Safari: exactly the visible screen, not the area behind its toolbars */
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--ui); display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding-top: max(3px, env(safe-area-inset-top, 0px)); padding-bottom: 3px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
h1 { font: 700 17px/1.1 var(--display); flex: none; margin: 0; letter-spacing: .01em; white-space: nowrap; }
h1 small { font: 400 12px var(--ui); color: var(--mut); margin-left: 6px; }
.grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lab { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); }
.seg { flex: none; display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 2px 7px; font: 600 12.5px var(--ui); cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
button.plain[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
button.plain { flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 7px; padding: 2px 8px; font: 600 12.5px var(--ui); cursor: pointer; white-space: nowrap; }
.rng { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mut); }
.rng input { width: 110px; accent-color: var(--acc); }
.menu { position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 10px 28px rgba(0,0,0,.2); padding: 10px 12px; display: grid; gap: 8px; }
.menu .row { display: flex; gap: 8px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; user-select: none; }
.search { position: relative; flex: 1 1 150px; min-width: 90px; max-width: 280px; }
header .seg.nb { display: inline-flex !important; }
.seg.nb button { font-size: 17px; padding: 1px 10px; }
.seg.nb button:disabled { color: var(--line); cursor: default; }
@media (max-width: 1440px) { h1 { display: none; } .rng input { width: 80px; } .rng span, #optBtn .t { display: none; } .search { flex-basis: 130px; max-width: 160px; } }
.seg .s, button .s { display: none; }
@media (max-width: 560px) { .rng span { display: none; } .rng input { width: 48px; } #optBtn .t { display: none; } header { gap: 4px 5px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .seg .l, button .l { display: none; } .seg .s, button .s { display: inline; } .seg button { padding: 2px 6px; } .search { flex: 1 1 60px; min-width: 56px; }
  .seg.nb button { padding: 1px 6px; } button.plain { padding: 2px 7px; } .rng input { width: 44px; } }

.search input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; background: var(--bg); color: var(--ink); font: 14px var(--ui); }
.results { position: fixed; width: 300px; z-index: 20; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: 50vh; overflow: auto; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 7px 10px; cursor: pointer; font: 14px var(--ui); }
.results button:hover, .results button.on { background: var(--soft); }
.results small { color: var(--mut); display: block; font-size: 12px; }
main { flex: 1; display: flex; min-height: 0; position: relative; }
#stage { flex: 1; min-width: 0; position: relative; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#cv3 { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv3:active { cursor: grabbing; }
#panel { position: absolute; top: 0; right: 0; bottom: 0; z-index: 6; width: 380px; max-width: 88vw; border-left: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 16px 18px; box-shadow: -10px 0 30px rgba(0,0,0,.18); transform: translateX(105%); visibility: hidden; transition: transform .22s ease, visibility 0s .22s; padding-right: max(18px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
#panel h2 { font: 700 22px/1.15 var(--display); margin: 0 0 4px; padding-right: 30px; text-wrap: balance; }
body.open #panel { transform: none; visibility: visible; transition: transform .22s ease; }
#pclose { position: sticky; top: 0; float: right; margin: -6px -6px 0 0; z-index: 1; background: var(--surface); }
#panel h3 { font: 600 11px var(--ui); text-transform: uppercase; letter-spacing: .07em; color: var(--mut); margin: 18px 0 6px; }
#panel p { margin: 6px 0; max-width: 65ch; }
.crumbs { font-size: 12px; color: var(--mut); }
.crumbs a { color: var(--mut); cursor: pointer; text-decoration: underline dotted; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.pill { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }
.res { display: grid; grid-template-columns: 74px 1fr; gap: 6px 10px; align-items: start; }
.res .bar { display: flex; gap: 3px; margin-top: 4px; }
.res .bar i { width: 16px; height: 8px; border-radius: 2px; background: var(--soft); }
.res .note { grid-column: 2; font-size: 12.5px; color: var(--mut); margin-top: -2px; }
.res b { font-weight: 600; font-size: 13px; }
.list { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.list li { padding: 3px 0; border-bottom: 1px solid var(--soft); display: flex; gap: 8px; justify-content: space-between; }
.list code, .mono { font: 12px var(--mono); }
.list a { color: var(--ink); cursor: pointer; }
.list .k { color: var(--mut); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dirup { color: var(--up); } .dirdown { color: var(--down); } .dirflow { color: var(--flow); }
.glist { list-style: none; padding: 0; margin: 8px 0; }
.glist li { border-top: 1px solid var(--line); }
.glist a { display: block; padding: 9px 2px; cursor: pointer; color: var(--ink); }
.glist b { display: block; font-size: 15px; } .glist span { color: var(--mut); font-size: 12.5px; }
.steps { display: flex; gap: 5px; flex-wrap: wrap; margin: 8px 0; }
.steps button { min-width: 28px; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 12.5px var(--ui); cursor: pointer; }
.steps button.done { background: var(--soft); }
.steps button[aria-current="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
.stepnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.ghl { border-left: 3px solid var(--acc); background: var(--soft); border-radius: 0 7px 7px 0; padding: 6px 10px; }
.ghl p { margin: 4px 0; }
.lab { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); }
.hintp { font-size: 12.5px; color: var(--mut); }
.hintp a, .list a.ic, a.ic { cursor: pointer; color: var(--acc); text-decoration: none; }
.sub { font-size: 12px; color: var(--mut); }
.tag { font: 600 10.5px var(--ui); border-radius: 4px; padding: 0 5px; margin-left: 5px; background: var(--soft); color: var(--mut); }
.sup { padding-left: 22px; margin: 6px 0; font-size: 13px; }
.sup li { padding: 4px 4px; border-radius: 6px; cursor: pointer; }
.sup li.on { background: var(--soft); outline: 2px solid var(--acc); }
.tree li { border-bottom: 0; padding-top: 1px; padding-bottom: 1px; }
.cmp { display: grid; gap: 6px; margin: 8px 0; } .cmp label { display: flex; gap: 8px; align-items: center; font-size: 12.5px; } .cmp input { flex: 1; accent-color: var(--acc); }
.add { color: var(--add); }
#tq { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; background: var(--bg); color: var(--ink); font: 14px var(--ui); margin: 6px 0; }
#tdir { margin: 4px 0; }
button.sm { font-size: 11.5px; padding: 0 7px; margin-left: 6px; text-transform: none; letter-spacing: 0; }
#inside { width: 100%; display: block; }
.backg { display: inline-block; margin-bottom: 6px; font-size: 12.5px; color: var(--acc); cursor: pointer; }
#mini { position: absolute; left: 12px; bottom: 38px; width: 196px; height: 112px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--surface) 88%, transparent); cursor: pointer; z-index: 4; }
.legend { font-size: 12.5px; color: var(--mut); display: grid; gap: 4px; }
.legend span.sw { display: inline-block; width: 22px; height: 3px; vertical-align: middle; margin-right: 6px; }
.heat { display: flex; gap: 2px; align-items: center; }
.heat i { width: 18px; height: 10px; border-radius: 2px; }
footer { border-top: 1px solid var(--line); background: var(--surface); padding-top: 2px; padding-bottom: max(2px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: center; }
footer #play { padding: 1px 8px; }
.track { position: relative; flex: 1 1 45%; min-width: 120px; height: 22px; }
.track input { position: absolute; inset: 0; width: 100%; margin: 0; background: transparent; }
footer input[type=range] { accent-color: var(--acc); }
#verInfo { flex: 1 1 55%; min-width: 0; font-size: 12px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
#verInfo b { color: var(--ink); }
#spark { position: absolute; inset: 0; height: 22px; width: 100%; display: block; opacity: .7; }
.node rect.box { stroke: var(--line); stroke-width: 1; }
.node text { fill: var(--ink); font: 600 12.5px var(--ui); pointer-events: none; }
.node text.sub { font: 400 10.5px var(--mono); fill: var(--mut); }
.node { cursor: pointer; }
.node.sel rect.box { stroke: var(--acc); stroke-width: 2.5; }
.node.chg rect.box { stroke: var(--flow); stroke-width: 2; stroke-dasharray: 4 3; }
.node.fade, .edge.fade { opacity: .05; }
.node.off { opacity: .32; }
.group > rect { fill: none; stroke: var(--line); stroke-dasharray: 3 3; }
.group > text { fill: var(--mut); font: 600 11px var(--ui); letter-spacing: .05em; text-transform: uppercase; }
.tier text { fill: var(--mut); font: italic 400 15px var(--display); }
.tier line { stroke: var(--line); }
.edge { fill: none; stroke: var(--mut); stroke-opacity: .35; }
.edge.flow { stroke: var(--flow); stroke-dasharray: 5 3; stroke-opacity: .55; }
.edge.up { stroke: var(--up); stroke-opacity: .95; }
.edge.down { stroke: var(--down); stroke-opacity: .95; }
.elabel { font: 11px var(--ui); fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--mut); background: color-mix(in srgb, var(--bg) 85%, transparent); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; font-size: 12.5px; max-width: 280px; box-shadow: 0 6px 18px rgba(0,0,0,.15); z-index: 5; }
@media (max-width: 760px) {
  #panel { top: auto; left: 0; width: auto; max-width: none; height: 48%; border-left: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.18); transform: translateY(105%); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  h1 small { display: none; }
}
/* touch screens: finger-sized controls; --k is the Size setting (Normal 1 = 44 px, Large 1.25, Extra large 1.5) */
:root { --k: 1; }
.touch header { gap: calc(6px * var(--k)) calc(8px * var(--k)); padding-bottom: 5px; }
.touch .seg button, .touch button.plain { min-height: calc(44px * var(--k)); min-width: calc(44px * var(--k)); padding: 0 calc(12px * var(--k)); font-size: calc(15px * var(--k)); }
.touch .seg.nb button { font-size: calc(20px * var(--k)); }
.touch .search input, .touch #tq { min-height: calc(44px * var(--k)); font-size: calc(16px * var(--k)); }
.touch .search { max-width: calc(280px * var(--k)); }
.touch input[type=range] { height: calc(44px * var(--k)); }
.touch .rng input { width: calc(110px * var(--k)); }
.touch footer { padding-top: 4px; } .touch footer #play { min-height: calc(44px * var(--k)); min-width: calc(52px * var(--k)); } .touch .track { height: calc(44px * var(--k)); }
.touch #verInfo { font-size: calc(12px * var(--k)); } .touch .hint { font-size: calc(12px * var(--k)); }
.touch #panel { width: calc(380px * var(--k)); font-size: calc(14px * var(--k)); }
.touch #panel h2 { font-size: calc(22px * var(--k)); } .touch #panel h3 { font-size: calc(11px * var(--k)); }
.touch .list { font-size: calc(13px * var(--k)); } .touch .list code, .touch .mono { font-size: calc(12px * var(--k)); }
.touch .pill, .touch .crumbs, .touch .hintp, .touch .sub, .touch .legend { font-size: calc(12.5px * var(--k)); }
.touch #pclose { min-height: calc(44px * var(--k)); min-width: calc(44px * var(--k)); font-size: calc(17px * var(--k)); }
.touch .list li { min-height: calc(44px * var(--k)); align-items: center; padding: 2px 0; }
.touch .list a, .touch .crumbs a, .touch .hintp a { display: inline-block; padding: calc(8px * var(--k)) 0; }
.touch a.ic { display: inline-flex; align-items: center; justify-content: center; min-width: calc(40px * var(--k)); min-height: calc(40px * var(--k)); font-size: calc(17px * var(--k)); }
.touch .steps button { min-width: calc(44px * var(--k)); height: calc(44px * var(--k)); border-radius: 99px; font-size: calc(15px * var(--k)); }
.touch .glist a { padding: calc(13px * var(--k)) 2px; } .touch .glist b { font-size: calc(15px * var(--k)); } .touch .glist span { font-size: calc(12.5px * var(--k)); }
.touch .sup { font-size: calc(13px * var(--k)); } .touch .sup li { padding: calc(10px * var(--k)) 6px; }
.touch .menu { font-size: calc(14px * var(--k)); } .touch .chk { min-height: calc(44px * var(--k)); font-size: calc(15px * var(--k)); } .touch .chk input { width: calc(22px * var(--k)); height: calc(22px * var(--k)); }
.touch .menu .row button { min-height: calc(44px * var(--k)); }
.touch .results { width: calc(300px * var(--k)); } .touch .results button { min-height: calc(44px * var(--k)); font-size: calc(14px * var(--k)); }
.touch .backg { padding: calc(10px * var(--k)) 0; font-size: calc(14px * var(--k)); }
.touch button.sm { min-height: calc(36px * var(--k)); font-size: calc(13px * var(--k)); }
.touch #mini { width: calc(196px * var(--k)); height: calc(112px * var(--k)); bottom: calc(30px + 10px * var(--k)); }
.touch .res { font-size: calc(13px * var(--k)); } .touch .res .bar i { width: calc(16px * var(--k)); height: calc(8px * var(--k)); } .touch .res .note { font-size: calc(12.5px * var(--k)); }
.sizes { display: flex; align-items: center; gap: 8px; font-size: 13px; }
@media (max-width: 560px) { .touch .seg button, .touch button.plain { padding: 0 9px; } .touch .rng input { width: 64px; } }

<header>
  <h1>Pult Atlas<small id="hdrVer"></small></h1>
  <div class="seg nb" id="navBtns"><button id="back" title="Back to the previous part (Alt + ←)" aria-label="Back" disabled>‹</button><button id="fwd" title="Forward (Alt + →)" aria-label="Forward" disabled>›</button><button id="home" title="Show everything" aria-label="Show everything">⌂</button></div>
  <div class="search"><input id="q" type="search" placeholder="Find a part or function…" autocomplete="off" aria-label="Find a part"><div class="results" id="res" hidden></div></div>
  <div class="seg" id="segArr" title="Arrangement"><button data-v="web" aria-pressed="true">Web</button><button data-v="layers" aria-pressed="false" aria-label="Layers"><span class="l">Layers</span><span class="s">Lay</span></button></div>
  <button class="plain" id="flatBtn" aria-pressed="false" title="Flatten the view onto a plane">Flat</button>
  <div class="seg" id="segMetric" title="Colour by"><button data-v="part" aria-pressed="true">Part</button><button data-v="mem" aria-pressed="false" title="Memory">Mem</button><button data-v="store" aria-pressed="false" title="Storage" aria-label="Storage"><span class="l">Store</span><span class="s">Sto</span></button><button data-v="cpu" aria-pressed="false">CPU</button><button data-v="gpu" aria-pressed="false">GPU</button></div>
  <div class="seg" id="segFocus" title="With a part selected, show only…"><button data-v="all" aria-pressed="true">All</button><button data-v="up" aria-pressed="false" title="only what the selected part relies on" aria-label="Relies on"><span class="l">Relies on</span><span class="s">↑</span></button><button data-v="down" aria-pressed="false" title="only what relies on the selected part" aria-label="Relied on by"><span class="l">Relied on by</span><span class="s">↓</span></button><button data-v="both" aria-label="Both" aria-pressed="false" title="only the selected part's connections"><span class="l">Both</span><span class="s">↕</span></button></div>
  <label class="rng" title="How far apart the parts are"><span>Spacing</span> <input type="range" id="spread" min="0.4" max="3" step="0.05" value="1" aria-label="Spacing"></label>
  <button class="plain" id="optBtn" aria-expanded="false" title="Options"><span class="t">Options </span>▾</button>
  <button class="plain" id="guideBtn" aria-pressed="false" title="Guided walks, start-up, traces, data, health, versions" aria-label="Explore"><span class="l">Explore</span><span class="s">✦</span></button>
  <button class="plain" id="infoBtn" title="How to read the drawing" aria-label="How to read the drawing">ⓘ</button>
</header>
<div class="menu" id="opts" hidden>
  <label class="chk"><input type="checkbox" id="ind" checked> Load indicators</label>
  <label class="chk"><input type="checkbox" id="offv"> Offline view</label>
  <label class="chk"><input type="checkbox" id="lbl"> Flow labels</label>
  <label class="chk"><input type="checkbox" id="chain"> Whole chains</label>
  <label class="chk"><input type="checkbox" id="miniChk"> Overview map</label>
  <div class="sizes">Size <div class="seg" id="segSize"><button data-v="1">Normal</button><button data-v="1.25">Large</button><button data-v="1.5">Extra large</button></div></div>
  <div class="row"><button class="plain" id="expAll">Expand all</button><button class="plain" id="colAll">Collapse</button></div>
</div>
<main>
  <div id="stage"><canvas id="cv3" aria-label="Components of Pult and how they connect"></canvas><canvas id="mini" aria-label="Overview: the main parts by floor; tap one to go there"></canvas><div class="hint" id="hint">Drag to turn (flat: to move) · pinch or scroll to zoom · twirl with two fingers · drag a part to pull it · double-tap to open it</div><div class="tip" id="tip" hidden></div></div>
  <aside id="panel" aria-label="About the part"><button class="plain" id="pclose" aria-label="Close">✕</button><div id="pbody"></div></aside>
</main>
<footer>
  <button class="plain" id="play" aria-label="Play through the versions">▶</button>
  <div class="track"><svg id="spark" aria-hidden="true"></svg><input type="range" id="ver" min="0" max="0" value="0" aria-label="Version"></div>
  <div id="verInfo"></div>
</footer>
