<style>

  .seg .l, button .l { display: none; } .seg .s, button .s { display: inline; } .seg button { padding: 2px 6px; } .search { flex: 1 1 60px; min-width: 56px; }

<header>
  <h1>Pult Atlas<small id="hdrVer"></small></h1>
  <div class="seg nb" id="navBtns"><button id="back" title="Back to the previous part (Alt + ←)" aria-label="Back" disabled>‹</button><button id="fwd" title="Forward (Alt + →)" aria-label="Forward" disabled>›</button><button id="home" title="Show everything" aria-label="Show everything">⌂</button></div>
